<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs>
<style>
.title{font:700 42px Arial,sans-serif;fill:#f5f7fb}
.h1{font:700 28px Arial,sans-serif;fill:#f5f7fb}
.body{font:400 17px Arial,sans-serif;fill:#aeb8cc}
.small{font:600 14px Arial,sans-serif;fill:#7f8ca6;letter-spacing:2px}
.blue{fill:#247bff}
.red{fill:#ff354f}
.card{fill:#0d1424;stroke:#25385f;stroke-width:1.5}
.chip{fill:#121c31;stroke:#2d4775;stroke-width:1}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.float{animation:float 4s ease-in-out infinite}
.pulse{animation:pulse 2.5s ease-in-out infinite}
</style></defs>
<rect width="1200" height="520" rx="24" fill="#070b16"/>

<text x="55" y="58" class="small blue">TECH STACK</text>
<text x="55" y="108" class="title">Tools I Work With</text>
<text x="55" y="145" class="body">A practical stack for full-stack development and AI/ML.</text>
<g transform="translate(55 190)">
<rect width="250" height="250" rx="20" class="card"/>
<text x="25" y="45" class="h1">Languages</text>
<text x="25" y="85" class="body">JavaScript</text><text x="25" y="115" class="body">Python</text><text x="25" y="145" class="body">C++ • C</text>
</g>
<g transform="translate(325 190)">
<rect width="250" height="250" rx="20" class="card"/>
<text x="25" y="45" class="h1">Frontend</text>
<text x="25" y="85" class="body">React.js</text><text x="25" y="115" class="body">HTML5 • CSS3</text><text x="25" y="145" class="body">Tailwind CSS</text>
</g>
<g transform="translate(595 190)">
<rect width="250" height="250" rx="20" class="card"/>
<text x="25" y="45" class="h1">Backend</text>
<text x="25" y="85" class="body">Node.js • Express.js</text><text x="25" y="115" class="body">FastAPI • REST APIs</text><text x="25" y="145" class="body">MongoDB</text>
</g>
<g transform="translate(865 190)">
<rect width="280" height="250" rx="20" class="card"/>
<text x="25" y="45" class="h1">AI / ML</text>
<text x="25" y="85" class="body">XGBoost • Scikit-learn</text><text x="25" y="115" class="body">SHAP • Pandas • NumPy</text>
<text x="25" y="145" class="body">TF-IDF • ML systems</text>
</g>

</svg>