<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs>
<style>
.title{font:700 42px Arial,sans-serif;fill:#f5f7fb}
.h1{font:700 28px Arial,sans-serif;fill:#f5f7fb}
.body{font:400 17px Arial,sans-serif;fill:#aeb8cc}
.small{font:600 14px Arial,sans-serif;fill:#7f8ca6;letter-spacing:2px}
.blue{fill:#247bff}
.red{fill:#ff354f}
.card{fill:#0d1424;stroke:#25385f;stroke-width:1.5}
.chip{fill:#121c31;stroke:#2d4775;stroke-width:1}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.float{animation:float 4s ease-in-out infinite}
.pulse{animation:pulse 2.5s ease-in-out infinite}
</style></defs>
<rect width="1200" height="520" rx="24" fill="#070b16"/>

<text x="55" y="58" class="small blue">ABOUT / LIFE</text>
<text x="55" y="108" class="title">More Than Just Code</text>
<text x="55" y="150" class="body">I'm a Computer Science undergraduate who enjoys building</text>
<text x="55" y="176" class="body">real-world products at the intersection of AI and full-stack</text>
<text x="55" y="202" class="body">development, while constantly learning new technologies.</text>
<g transform="translate(55 250)">
<rect width="205" height="100" rx="18" class="card"/>
<text x="25" y="38" class="h1">Problem Solver</text><text x="25" y="67" class="body">DSA • debugging • systems</text>
</g>
<g transform="translate(280 250)">
<rect width="205" height="100" rx="18" class="card"/>
<text x="25" y="38" class="h1">Product Builder</text><text x="25" y="67" class="body">AI • web • practical apps</text>
</g>
<g transform="translate(505 250)">
<rect width="205" height="100" rx="18" class="card"/>
<text x="25" y="38" class="h1">Always Learning</text><text x="25" y="67" class="body">New tools • new ideas</text>
</g>
<text x="760" y="105" class="small red">BEYOND THE KEYBOARD</text>
<g transform="translate(755 135)">
<rect width="125" height="250" rx="18" class="card"/>
<text x="22" y="45" class="h1">🏏</text><text x="18" y="82" class="h1">Cricket</text><text x="18" y="115" class="body">Sport, strategy</text><text x="18" y="140" class="body">&amp; team spirit.</text>
</g>
<g transform="translate(895 135)">
<rect width="125" height="250" rx="18" class="card"/>
<text x="22" y="45" class="h1">✈</text><text x="18" y="82" class="h1">Travel</text><text x="18" y="115" class="body">Places, people</text><text x="18" y="140" class="body">&amp; cultures.</text>
</g>
<g transform="translate(1035 135)">
